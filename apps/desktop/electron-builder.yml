# electron-builder 配置
#
# 为什么从 Tauri 迁到 Electron：
#   Tauri 产物是「Rust 外壳 + 运行时自解压」，撞杀软「自解压 + 写文件」
#   高危特征，火绒误报率最高。
#
# 本配置**逐条对齐**已在同一台机器验证可用的参考项目
# （sillytavern-shell / bd2-l2d-viewer）：
#   · files 显式白名单（不用 glob 通配）
#   · compression: maximum
#   · asar: false
#   · 自定义 icon
#   · afterPack 硬校验
#   · nsis.include 自定义安装脚本

appId: com.doomsdayharem.app
productName: DoomsdayHarem
copyright: Copyright (c) 2026 RanMiao. Free to play, no resale, no commercial use.

directories:
  output: dist-electron
  buildResources: build

# 最大压缩 —— 与 sillytavern-shell 一致
compression: maximum

# 显式文件白名单 —— 与 sillytavern-shell 一致。
# 不用 glob 通配，避免误带 node_modules（实测会拖进 179 个条目）。
files:
  - dist/**/*
  - electron/**/*
  - package.json

# asar 关闭 —— 与两个参考项目一致。
# 归档会阻止杀软查看内部文件，容易被判定为「隐藏行为」。
asar: false

# 打包后硬校验 —— 与 sillytavern-shell 的 afterPack 一致。
# 缺文件时直接构建失败，避免「装完才发现打不开」。
afterPack: ./scripts/afterPack.cjs

# Windows 可执行文件的版本资源由 package.json 提供：
#   author.name  → CompanyName
#   description  → FileDescription
# 必须为纯 ASCII —— rcedit 对中文会静默失败（Unable to commit changes）。
win:
  # 必须指定自己的图标。默认 Electron 图标是大量木马的特征。
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  artifactName: ${productName}-${version}-${arch}.${ext}

nsis:
  # 自定义安装脚本 —— 与参考项目一致
  include: build/installer.nsh
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  # 名称不能含 /（Windows 文件名非法字符）
  shortcutName: DoomsdayHarem
  deleteAppDataOnUninstall: false

portable:
  artifactName: ${productName}-${version}-portable.${ext}
